<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Anamnesebogen</title>
<style>
  :root{--ink:#1f2a33;--grau:#4f5d66;--linie:#d5dbe0;--grund:#f4f6f5;--karte:#fff;--akzent:#17606b;--akzent-text:#124b54;--akzent-hell:#e3f0f2;--warn:#8a4b00;--warn-hell:#fff1dc;--ok:#1f6b3a;--ok-hell:#e2f3e8}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:18px;line-height:1.5;color:var(--ink);background:var(--grund)}
  .kopf{position:sticky;top:0;z-index:5;background:var(--karte);border-bottom:1px solid var(--linie);padding:0.7rem 1rem;padding-top:calc(0.7rem + env(safe-area-inset-top))}
  .kopf .titel{font-weight:700;letter-spacing:0.08em;text-transform:uppercase;font-size:0.85rem;color:var(--akzent-text)}
  .fortschritt{height:8px;background:var(--linie);border-radius:4px;margin-top:0.5rem;overflow:hidden}
  .fortschritt div{height:100%;background:var(--akzent);width:0;transition:width 0.2s}
  .kopf .schritt{font-size:0.9rem;color:var(--grau);margin-top:0.3rem}
  main{max-width:720px;margin:0 auto;padding:1rem 1rem 8rem}
  h1{font-size:1.5rem;margin:0.5rem 0 0.4rem;line-height:1.3}
  h2{font-size:1.25rem;margin:1.6rem 0 0.5rem;color:var(--akzent-text)}
  p{margin:0.4rem 0}
  .hinweis{background:var(--akzent-hell);border:1px solid #bcd6da;border-radius:10px;padding:0.8rem 1rem;margin:0.8rem 0;font-size:1rem}
  .frage{background:var(--karte);border:1px solid var(--linie);border-radius:12px;padding:1rem;margin:0.9rem 0}
  .frage label.haupt{display:block;font-weight:600;margin-bottom:0.5rem}
  .frage .hilfe{color:var(--grau);font-size:0.95rem;margin:-0.2rem 0 0.6rem}
  input[type=text],input[type=number],textarea,select{font:inherit;width:100%;padding:0.75rem 0.8rem;border:1.5px solid var(--linie);border-radius:10px;background:#fff;color:var(--ink);min-height:48px}
  textarea{min-height:6rem;resize:vertical}
  input:focus,textarea:focus,select:focus{outline:3px solid #9fc9cf;border-color:var(--akzent)}
  .optionen{display:flex;flex-wrap:wrap;gap:0.5rem}
  .optionen label{display:inline-flex;align-items:center;gap:0.45rem;border:1.5px solid var(--linie);border-radius:999px;padding:0.55rem 0.9rem;background:#fff;cursor:pointer;min-height:48px;font-size:1rem}
  .optionen label:has(input:checked){border-color:var(--akzent);background:var(--akzent-hell);color:var(--akzent-text);font-weight:600}
  .optionen input{width:1.15rem;height:1.15rem;margin:0;accent-color:var(--akzent);flex:none}
  .skala{display:grid;grid-template-columns:repeat(11,1fr);gap:0.3rem}
  .skala label{display:flex;align-items:center;justify-content:center;border:1.5px solid var(--linie);border-radius:8px;min-height:48px;background:#fff;cursor:pointer;font-weight:600}
  .skala label:has(input:checked){background:var(--akzent);color:#fff;border-color:var(--akzent)}
  .skala input{position:absolute;opacity:0;width:0;height:0}
  .skala-legende{display:flex;justify-content:space-between;color:var(--grau);font-size:0.85rem;margin-top:0.3rem}
  .liste .zeile{display:grid;gap:0.5rem;border-top:1px solid var(--linie);padding-top:0.7rem;margin-top:0.7rem}
  .liste .zeile:first-child{border-top:none;padding-top:0;margin-top:0}
  .liste .zeile .titel{font-size:0.85rem;color:var(--grau);text-transform:uppercase;letter-spacing:0.05em}
  .matrix{display:grid;gap:0.55rem}
  .matrix .mgruppe{font-weight:700;color:var(--akzent-text);margin-top:0.7rem;font-size:1rem}
  .matrix .mgruppe:first-child{margin-top:0}
  .matrix .mzeile{border:1px solid var(--linie);border-radius:12px;padding:0.6rem 0.7rem;background:#fff}
  .matrix .mlabel{font-weight:600;margin-bottom:0.4rem;font-size:0.97rem}
  .matrix .mopt{display:grid;grid-template-columns:repeat(2,1fr);gap:0.35rem}
  .matrix .mopt label{display:flex;align-items:center;justify-content:center;gap:0.3rem;line-height:1.25;
    border:1.5px solid var(--linie);border-radius:10px;padding:0.5rem 0.4rem;min-height:46px;text-align:center;font-size:0.9rem;cursor:pointer}
  .matrix .mopt label:has(input:checked){border-color:var(--akzent);background:var(--akzent-hell);font-weight:600}
  .matrix .mopt input{position:absolute;opacity:0;pointer-events:none}
  .score-box{border:1.5px solid var(--akzent);border-radius:12px;padding:0.7rem 0.9rem;background:var(--akzent-hell);margin-top:0.6rem;font-size:0.95rem}
  .knopf{font:inherit;font-weight:600;padding:0.85rem 1.2rem;border-radius:12px;border:1.5px solid var(--akzent);background:var(--akzent);color:#fff;cursor:pointer;min-height:52px}
  .knopf.zweit{background:#fff;color:var(--akzent-text)}
  .knopf.klein{min-height:44px;padding:0.5rem 0.9rem;font-size:0.95rem}
  .knopf:disabled{opacity:0.5}
  .leiste{position:fixed;left:0;right:0;bottom:0;background:var(--karte);border-top:1px solid var(--linie);padding:0.7rem 1rem;padding-bottom:calc(0.7rem + env(safe-area-inset-bottom));display:flex;gap:0.6rem;justify-content:space-between;z-index:5}
  .leiste .knopf{flex:1}
  .frage .fall{font-weight:700;color:var(--akzent-text)}
  .uebersicht{background:var(--karte);border:1px solid var(--linie);border-radius:12px;padding:1rem}
  .uebersicht .abschnitt{border-top:1px solid var(--linie);padding:0.6rem 0}
  .uebersicht .abschnitt:first-child{border-top:none}
  .uebersicht .abschnitt b{display:block;color:var(--akzent-text)}
  .uebersicht .abschnitt span{color:var(--grau);font-size:0.95rem}
  .meldung{position:fixed;left:1rem;right:1rem;bottom:6rem;background:var(--ink);color:#fff;padding:0.8rem 1rem;border-radius:10px;z-index:9;text-align:center}
  .meldung.fehler{background:#8b1a1a}
  .klein{font-size:0.9rem;color:var(--grau)}
  .aktionen{display:flex;flex-wrap:wrap;gap:0.6rem;margin-top:0.8rem}
  @media (min-width:700px){body{font-size:17px}.matrix .mopt{grid-template-columns:repeat(4,1fr)}}
  @media print{.kopf,.leiste,.aktionen{display:none}main{padding:0}.frage{break-inside:avoid}}
</style>
</head>
<body>
<header class="kopf">
  <div class="titel">Anamnesebogen · vertraulich</div>
  <div class="fortschritt"><div id="balken"></div></div>
  <div class="schritt" id="schritt-text">Schritt 1</div>
</header>
<main id="app"></main>
<nav class="leiste">
  <button class="knopf zweit" id="zurueck" type="button">Zurück</button>
  <button class="knopf" id="weiter" type="button">Weiter</button>
</nav>
<div id="meldung" class="meldung" hidden></div>

<script>

        { id: "taille", typ: "number", label: "Taillenumfang in cm (auf Nabelhöhe, optional)", hilfe: "Ein Maßband reicht. Der Wert sagt mehr über den Stoffwechsel als das Gewicht allein." },
        { id: "gewicht_verlauf", typ: "radio", label: "Wie hat sich Ihr Gewicht in den letzten zwölf Monaten entwickelt?", optionen: ["etwa gleich geblieben", "zugenommen, gewollt", "zugenommen, ungewollt", "abgenommen, gewollt", "abgenommen, ungewollt"] },

    { id: "sicherheit", titel: "Wichtig für Ihre Sicherheit", intro: `<p>Diese Fragen entscheiden, was in Ihrem Fall empfohlen werden darf und was nicht.</p>`,

    return w != null && w !== "" && !ausser.includes(w);
  }
  function sichtbareAbschnitte() { return abschnitte.filter(passtZu); }
  function fragenVon(a) { return a.fragen.filter(passtZu); }
  function aktiveFragenVon(a) { return fragenVon(a).filter(bedingungErfuellt); }

  /* ---------- Rendern ---------- */
  function feldHtml(f, wert, praefix) {
    const id = praefix ? `${praefix}__${f.id}` : f.id;
    const name = esc(id);
    switch (f.typ) {
      case "text": return `<input type="text" name="${name}" value="${esc(wert)}" autocomplete="off">`;
      case "number": return `<input type="number" inputmode="numeric" name="${name}" value="${esc(wert)}">`;
      case "textarea": return `<textarea name="${name}">${esc(wert)}</textarea>`;
      case "radio": return `<div class="optionen">${f.optionen.map((o) => `<label><input type="radio" name="${name}" value="${esc(o)}" ${wert === o ? "checked" : ""}>${esc(o)}</label>`).join("")}</div>`;
      case "checks": { const w = Array.isArray(wert) ? wert : []; return `<div class="optionen">${f.optionen.map((o) => `<label><input type="checkbox" name="${name}" value="${esc(o)}" ${w.includes(o) ? "checked" : ""}>${esc(o)}</label>`).join("")}</div>`; }
      case "skala": return `<div class="skala">${Array.from({ length: 11 }, (_, i) => `<label><input type="radio" name="${name}" value="${i}" ${String(wert) === String(i) ? "checked" : ""}>${i}</label>`).join("")}</div><div class="skala-legende"><span>0</span><span>10</span></div>`;
      case "matrix": {
        /* Viele gleichartige Fragen in einem Block. Die Werte bleiben flach unter der jeweiligen Zeilen-ID.
           Zeilen mit Bereich bekommen eine Zwischenüberschrift, sobald der Bereich wechselt. */
        let bereich = null;
        const zeilen = f.zeilen.map((z) => {
          const kopf = z.bereich && z.bereich !== bereich ? `<div class="mgruppe">${esc(D.bereiche[z.bereich] || z.bereich)}</div>` : "";
          bereich = z.bereich || bereich;
          return `${kopf}<div class="mzeile"><div class="mlabel">${esc(z.label)}</div>
            <div class="mopt">${f.optionen.map((o) => `<label><input type="radio" name="${esc(z.id)}" value="${esc(o)}" ${daten.antworten[z.id] === o ? "checked" : ""}>${esc(o)}</label>`).join("")}</div>
          </div>`;
        }).join("");
        return `<div class="matrix">${zeilen}</div>${f.auswertung === "symptom" ? `<div class="score-box" data-scorebox="${esc(f.id)}"></div>` : ""}`;
      }
      case "liste": {
        const zeilen = Array.isArray(wert) ? wert : [];
        const n = Math.max(2, Math.min(f.anzahl, zeilen.length + 1));
        return `<div class="liste" data-liste="${name}" data-max="${f.anzahl}">${Array.from({ length: n }, (_, i) => zeileHtml(f, zeilen[i] || {}, i)).join("")}</div>
          <div class="aktionen"><button type="button" class="knopf zweit klein" data-mehr="${name}">Weitere Zeile</button></div>`;
      }
      default: return "";
    }
  }
  function zeileHtml(f, zeile, i) {
    return `<div class="zeile" data-index="${i}"><div class="titel">${i + 1}</div>${f.felder.map((u) => `<div><label class="klein">${esc(u.label)}</label>${feldHtml(u, zeile[u.id] ?? "", `${f.id}__${i}`)}</div>`).join("")}</div>`;
  }

  function frageHtml(f) {
    if (f.typ === "fallnummer") {
      const fall = BRIEFKASTEN && BRIEFKASTEN.fall ? esc(BRIEFKASTEN.fall) : "Vorschau, ohne persönlichen Link";
      return `<div class="frage" data-frage="fallnummer"><label class="haupt">${esc(f.label)}: <span class="fall">${fall}</span></label><div class="hilfe">Ist über Ihren persönlichen Link bereits eingetragen. Ihr Name ist nicht nötig.</div></div>`;
    }
    const wert = daten.antworten[f.id];
    return `<div class="frage" data-frage="${esc(f.id)}"${bedingungErfuellt(f) ? "" : " hidden"}>
      <label class="haupt">${esc(f.label)}</label>
      ${f.hilfe ? `<div class="hilfe">${esc(f.hilfe)}</div>` : ""}
      ${feldHtml(f, wert ?? "", "")}
    </div>`;
  }

  function render() {
    const liste = sichtbareAbschnitte();
    schritt = Math.max(0, Math.min(schritt, liste.length - 1));
    const a = liste[schritt];
    balken.style.width = `${Math.round((schritt / (liste.length - 1)) * 100)}%`;
    schrittText.textContent = `Schritt ${schritt + 1} von ${liste.length}: ${a.titel}`;
    if (a.id === "ende") { renderEnde(); } else {
      app.innerHTML = `<h1>${esc(a.titel)}</h1>${a.intro || ""}${fragenVon(a).map(frageHtml).join("")}`;
      verdrahte();
      aktualisiereAnzeigen();
    }
    document.getElementById("zurueck").disabled = schritt === 0;
    document.getElementById("weiter").hidden = schritt === liste.length - 1;
    window.scrollTo({ top: 0 });
    speichern();
  }

  function verdrahte() {
    app.querySelectorAll("input, textarea, select").forEach((el) => { el.addEventListener("change", lies); el.addEventListener("input", lies); });
    app.querySelectorAll("[data-mehr]").forEach((b) => b.addEventListener("click", () => {
      const box = app.querySelector(`.liste[data-liste="${b.dataset.mehr}"]`);
      const n = box.querySelectorAll(".zeile").length;
      if (n >= Number(box.dataset.max)) { meldung(`Maximal ${box.dataset.max} Zeilen.`); return; }
      const f = aktuelleFragen().find((x) => x.id === b.dataset.mehr);
      box.insertAdjacentHTML("beforeend", zeileHtml(f, {}, n));
      box.querySelectorAll(".zeile:last-child input, .zeile:last-child textarea").forEach((el) => { el.addEventListener("change", lies); el.addEventListener("input", lies); });
    }));
  }

  /* ---------- Auswertung (gleiche Regeln wie cockpit/src/bogen-auswertung.ts) ---------- */
  function teilsumme(ids, skala) {
    let s = 0;
    for (const id of ids) { const p = skala.indexOf(daten.antworten[id]); if (p < 0) return { wert: null, vollstaendig: false }; s += p; }
    return { wert: s, vollstaendig: true };
  }
  function berechneSymptomCheck() {
    const bereiche = {};
    for (const b of Object.keys(D.bereiche)) bereiche[b] = teilsumme(D.symptomZeilen.filter((z) => z.bereich === b).map((z) => z.id), D.checkSkala);
    const punkte = D.symptomZeilen.map((z) => D.checkSkala.indexOf(daten.antworten[z.id]));
    const beantwortet = punkte.filter((p) => p >= 0).length;
    const g = daten.antworten.geschlecht;
    const geschlechtsteil = D.geschlechtZeilen[g] ? teilsumme(D.geschlechtZeilen[g].map((z) => z.id), D.checkSkala) : { wert: null, vollstaendig: false };
    return {
      version: "3.0", zeitraum: "letzte 4 Wochen", skala: D.checkSkala, bereiche,
      gesamt: beantwortet === D.symptomZeilen.length ? punkte.reduce((a, b) => a + b, 0) : null, max: 81,
      beantwortet, zeilen_mit_wert: punkte.filter((p) => p >= 1).length, geschlechtsteil,
    };
  }
  function berechnePhq4() {
    const ids = D.phq4Zeilen.map((z) => z.id);
    const phq2 = teilsumme(ids.slice(0, 2), D.phqSkala);
    const gad2 = teilsumme(ids.slice(2), D.phqSkala);
    const vollstaendig = phq2.vollstaendig && gad2.vollstaendig;
    return { zeitraum: "letzte 2 Wochen", gesamt: vollstaendig ? phq2.wert + gad2.wert : null, phq2: phq2.wert, gad2: gad2.wert, vollstaendig };
  }
  function aktualisiereAnzeigen() {
    const box = app.querySelector("[data-scorebox]");
    if (box) {
      const r = berechneSymptomCheck();
      box.innerHTML = !r.beantwortet ? "Sobald Sie die Zeilen ausfüllen, erscheint hier Ihr Wert."
        : (r.gesamt == null ? `<b>${r.beantwortet} von ${D.symptomZeilen.length} Zeilen ausgefüllt.</b> Der Gesamtwert erscheint, sobald alle Zeilen beantwortet sind.`
          : `<b>Ihr Symptom-Wert: ${r.gesamt} von 81</b>`) +
          `<br><span class="klein">Der Wert ist kein Urteil. Er dient dazu, in einigen Wochen zu sehen, ob sich etwas bewegt hat.</span>`;
    }
    /* Bedingte Fragen ein- oder ausblenden; ausgeblendete verlieren ihre Antwort. */
    for (const f of aktuelleFragen()) {
      if (!f.wenn) continue;
      const el = app.querySelector(`[data-frage="${f.id}"]`);
      const an = bedingungErfuellt(f);
      if (el) el.hidden = !an;
      if (!an && f.id in daten.antworten) {
        delete daten.antworten[f.id];
        if (el) el.querySelectorAll("input, textarea").forEach((x) => { if (x.type === "checkbox" || x.type === "radio") x.checked = false; else x.value = ""; });
      }
    }
  }

  function aktuelleFragen() { return fragenVon(sichtbareAbschnitte()[schritt]); }

  function lies() {
    for (const f of aktuelleFragen()) {
      if (f.typ === "fallnummer") continue; /* kommt aus dem Link, kein Feld auf der Seite */
      if (f.typ === "liste") {
        const zeilen = [];
        app.querySelectorAll(`.liste[data-liste="${f.id}"] .zeile`).forEach((z, i) => {
          const obj = {}; let leer = true;
          for (const u of f.felder) {
            const v = liesFeld(u, `${f.id}__${i}__${u.id}`, z);
            if (v !== "" && v != null && !(Array.isArray(v) && !v.length)) { obj[u.id] = v; leer = false; }
          }
          if (!leer) zeilen.push(obj);
        });
        daten.antworten[f.id] = zeilen;
      } else if (f.typ === "matrix") {
        for (const z of f.zeilen) {
          const el = app.querySelector(`input[name="${z.id}"]:checked`);
          if (el) daten.antworten[z.id] = el.value; else delete daten.antworten[z.id];
        }
      } else {
        const v = liesFeld(f, f.id, app);
        if (v === "" || v == null || (Array.isArray(v) && !v.length)) delete daten.antworten[f.id]; else daten.antworten[f.id] = v;
      }
    }
    aktualisiereAnzeigen();
    speichern();
  }
  function liesFeld(f, name, wurzel) {
    if (f.typ === "checks") return [...wurzel.querySelectorAll(`input[name="${name}"]:checked`)].map((i) => i.value);
    if (f.typ === "radio" || f.typ === "skala") { const el = wurzel.querySelector(`input[name="${name}"]:checked`); return el ? (f.typ === "skala" ? Number(el.value) : el.value) : ""; }
    const el = wurzel.querySelector(`[name="${name}"]`); return el ? el.value.trim() : "";
  }

  /* ---------- Abschluss: Übersicht und Senden ---------- */
  function zeileFuer(f) {
    if (f.typ === "fallnummer") return daten.antworten.fallnummer ? [`- ${f.label}: ${daten.antworten.fallnummer}`] : [];
    if (f.typ === "matrix") {
      const r = f.zeilen.filter((z) => daten.antworten[z.id]).map((z) => `  ${z.label}: ${daten.antworten[z.id]}`);
      return r.length ? [`- ${f.label}`, ...r] : [];
    }
    const w = daten.antworten[f.id];
    if (w == null || w === "" || (Array.isArray(w) && !w.length)) return [];
    if (f.typ === "liste") return [`- ${f.label}:`, ...w.map((z, i) => `  ${i + 1}. ${f.felder.map((u) => z[u.id] != null && z[u.id] !== "" ? `${u.label.replace(/\s*\(.*$/, "")}: ${z[u.id]}` : null).filter(Boolean).join(" · ")}`)];
    if (Array.isArray(w)) return [`- ${f.label}: ${w.join(", ")}`];
    return [`- ${f.label}: ${w}`];
  }
  function zusammenfassung() {
    const zeilen = [];
    for (const a of sichtbareAbschnitte()) {
      if (a.id === "ende") continue;
      const teil = aktiveFragenVon(a).flatMap(zeileFuer);
      if (!teil.length) continue;
      if (a.id === "start") zeilen.push(...teil); else zeilen.push(`\n## ${a.titel}`, ...teil);
    }
    return zeilen.join("\n");
  }
  function istBeantwortet(f) {
    if (f.typ === "matrix") return f.zeilen.some((z) => daten.antworten[z.id]);
    const w = daten.antworten[f.id];
    return w != null && w !== "" && !(Array.isArray(w) && !w.length);
  }
  function beantwortet() {
    let n = 0, gesamt = 0;
    for (const a of sichtbareAbschnitte()) for (const f of aktiveFragenVon(a)) { if (f.typ === "fallnummer") continue; gesamt++; if (istBeantwortet(f)) n++; }
    return { n, gesamt };
  }
  function exportObjekt() {
    return {
      bogen: "FM-Anamnesebogen", bogenVersion: BOGEN_VERSION, exportiert: new Date().toISOString(), fallnummer: daten.antworten.fallnummer || "",
      antworten: daten.antworten, unbekannt: [],
      symptom_check: berechneSymptomCheck(), phq4: berechnePhq4(), zusammenfassung: zusammenfassung(),
    };
  }
  function b64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }
  function b64urlZuBytes(s) { const b = atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)); return Uint8Array.from(b, (c) => c.charCodeAt(0)); }
  async function sendeVerschluesselt() {
    if (!SCHLUESSEL) throw new Error("Der Link ist unvollständig (Schlüssel fehlt). Bitte den Link aus der Nachricht vollständig öffnen.");
    const rohSchluessel = b64urlZuBytes(SCHLUESSEL);
    if (rohSchluessel.length !== 32) throw new Error("Der Schlüssel im Link ist ungültig.");
    const key = await crypto.subtle.importKey("raw", rohSchluessel, { name: "AES-GCM" }, false, ["encrypt"]);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const chiffre = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(exportObjekt())));
    const antwort = await fetch(abgabeUrl(), { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ token: BRIEFKASTEN.token, iv: b64(iv), chiffre: b64(chiffre) }) });
    let d = null; try { d = await antwort.json(); } catch (_) {}
    if (!antwort.ok) throw new Error((d && d.error) || `Senden fehlgeschlagen (${antwort.status}).`);
  }
  function uebersichtHtml() {
    return sichtbareAbschnitte().filter((a) => a.id !== "ende").map((a) => {
      const teil = aktiveFragenVon(a).flatMap(zeileFuer);
      return `<div class="abschnitt"><b>${esc(a.titel)}</b>${teil.length ? teil.map((t) => `<div>${esc(t.replace(/^- /, ""))}</div>`).join("") : '<span>keine Angaben</span>'}</div>`;
    }).join("");
  }

  function renderEnde() {
    const { n, gesamt } = beantwortet();
    if (!BRIEFKASTEN) {
      app.innerHTML = `<h1>Ende der Vorschau</h1>
        <p>${n} von ${gesamt} Fragen beantwortet.</p>
        <div class="hinweis">Das ist eine Vorschau ohne persönlichen Link. Senden ist nur über den Link aus der Einladung möglich.</div>
        <h2>Antworten in der Übersicht</h2>
        <div class="uebersicht">${uebersichtHtml()}</div>
        <div class="aktionen"><button class="knopf zweit klein" type="button" id="loeschen">Antworten dieser Vorschau löschen</button></div>`;
      document.getElementById("loeschen").addEventListener("click", () => {
        try { localStorage.removeItem(SPEICHER); } catch (_) {}
        daten = neu(); schritt = 0; render();
      });
      return;
    }
    app.innerHTML = `<h1>Fertig</h1>
      <p>Sie haben ${n} von ${gesamt} Fragen beantwortet. Das reicht, auch wenn Lücken bleiben.</p>
      <div class="hinweis">Mit dem Knopf werden Ihre Antworten auf diesem Gerät verschlüsselt und an mich übertragen. Nur ich kann sie lesen. Nach dem Senden werden die Antworten auf diesem Gerät automatisch gelöscht.</div>
      <div class="aktionen"><button class="knopf" type="button" id="absenden">Anamnesebogen speichern und senden</button></div>
      <h2>Ihre Antworten in der Übersicht</h2>
      <div class="uebersicht">${uebersichtHtml()}</div>`;
    document.getElementById("absenden").addEventListener("click", async () => {
      const b = document.getElementById("absenden"); b.disabled = true; b.textContent = "Wird gesendet …";
      try {
        await sendeVerschluesselt();
        try { localStorage.removeItem(SPEICHER); } catch (_) {}
        app.innerHTML = `<h1>Vielen Dank</h1><p>Ihr Anamnesebogen ist bei mir angekommen. Die Antworten sind auf diesem Gerät gelöscht. Sie können dieses Fenster jetzt schließen.</p>`;
        document.querySelector(".leiste").hidden = true;
      } catch (e) { meldung(e.message, true); b.disabled = false; b.textContent = "Anamnesebogen speichern und senden"; }
    });
  }

  document.getElementById("weiter").addEventListener("click", () => { lies(); schritt++; render(); });
  document.getElementById("zurueck").addEventListener("click", () => { lies(); schritt--; render(); });

  function hinweisSeite(titel, text) {
    app.innerHTML = `<h1>${esc(titel)}</h1><p>${esc(text)}</p>`;
    document.querySelector(".leiste").hidden = true;
    schrittText.textContent = "";
  }
  /* Statisch gehostet: Kontext zum Token vom Server holen, dann rendern. Ohne Link nur Hinweis oder Vorschau. */
  async function start() {
    if (API && TOKEN_AUS_URL && !BRIEFKASTEN) {
      app.innerHTML = '<p class="leer">Anamnesebogen wird geladen …</p>';
      try {
        const r = await fetch(`${API}/kontext?t=${encodeURIComponent(TOKEN_AUS_URL)}`);
        const d = await r.json().catch(() => ({}));
        if (!r.ok) { hinweisSeite("Hinweis", d.error || "Dieser Link ist nicht mehr gültig."); return; }
        BRIEFKASTEN = { token: d.token, fall: d.fall };
      } catch (e) { hinweisSeite("Hinweis", "Der Anamnesebogen konnte nicht geladen werden (keine Verbindung). Bitte später noch einmal öffnen."); return; }
    }
    if (!BRIEFKASTEN && !VORSCHAU) { hinweisSeite("Anamnesebogen", "Bitte öffnen Sie den Anamnesebogen über den persönlichen Link aus Ihrer Nachricht. Nur so kommen Ihre Antworten verschlüsselt bei mir an."); return; }
    await ladeZwischenstand();
    render();
  }
  start();
})();
</script>
</body>
</html>
